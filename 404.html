  .nf-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .7rem 1.5rem; border-radius: 999px; font-size: .92rem; font-weight: 500;
    text-decoration: none; transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .nf-btn.primary { background: #8B5CF6; color: #fff; border: 1px solid #8B5CF6; }
  .nf-btn.primary:hover { transform: translateY(-2px); }
  .nf-btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .nf-btn.ghost:hover { border-color: #8B5CF6; color: #8B5CF6; }
